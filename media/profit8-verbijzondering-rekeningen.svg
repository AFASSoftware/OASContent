<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000" role="img" aria-labelledby="title desc">
  <title id="title">Bepaling rekening artikelgroep verbijzondering</title>
  <desc id="desc">Beslisboom voor welke rekening wordt gebruikt op basis van de instellingen voor activering, journaliseren en voorraadhoudend.</desc>
  <defs>
    <style>
      text {
        font-family: "Segoe UI", Arial, sans-serif;
        fill: #1f2937;
      }
      .title {
        font-size: 36px;
        font-weight: 700;
        fill: #0053a1;
      }
      .node {
        fill: #ffffff;
        stroke: #1f2937;
        stroke-width: 2;
      }
      .line {
        stroke: #1f2937;
        stroke-width: 2.5;
        fill: none;
      }
      .edge {
        font-size: 22px;
        font-weight: 600;
      }
      .decision {
        font-size: 22px;
        font-weight: 600;
      }
      .boxtext {
        font-size: 22px;
      }
      .outcome {
        font-size: 18px;
        font-weight: 600;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
